# SonarQube local, isolado do stack da app (banco e rede proprios, nao
# interfere com nota-postgres). Community Edition : cobre bugs/code smells/
# duplicacao em Python, sem as regras de seguranca da edicao paga.
#
# Uso :
#   docker compose -f docker-compose.sonar.yml up -d
#   abrir http://localhost:9000 (login padrao admin/admin, troca na 1a vez)
services:
  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks: [sonar]

  sonarqube:
    image: sonarqube:community
    depends_on: [sonar-db]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks: [sonar]

networks:
  sonar: {}

volumes:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
