---
# Configuration exa-pie pour le developpement.
#
# NO-VERIFIER n'effectue AUCUNE verification de signature : tout JWT correctement
# forme est accepte. Reserve au developpement et aux tests, jamais a la production
# (cf. conf/pie.prod.yaml).
#
# Les patterns sont evalues dans leur ordre de declaration : le premier qui
# correspond l'emporte, du plus specifique au plus general.
pie:
  security:
    mode: FBI
    verifier: NO-VERIFIER
    algorithms:
      - RS256
    log-level: INFO

    # Routes techniques : ni token ni role.
    # /openapi.json est charge par la page Swagger sans en-tete Authorization.
    public-uris:
      - ^\/?health(.*)?$
      - ^\/?docs(.*)?$
      - ^\/?redoc(.*)?$
      - ^\/?openapi\.json$
      # - ^\/?static(.*)?$

    # Filtre grossier par zone. Le controle fin (methode HTTP, appartenance au
    # projet, cloisonnement par organisation) reste porte par l'API.
    # uris-by-roles:
    #   ^\\/?db-check$: ADMIN
    #   ^\\/?api\\/v1\\/organisations(.*)?$: ADMIN
    #   ^\\/?api\\/v1\\/users\\/me$: ADMIN|SUPERVISOR|OPERATOR
    #   ^\\/?api\\/v1\\/users(.*)?$: ADMIN
    #   ^\\/?api\\/v1\\/schemas(.*)?$: ADMIN|SUPERVISOR
    #   ^\\/?api\\/v1\\/datasets(.*)?$: ADMIN|SUPERVISOR
    #   ^\\/?api\\/v1\\/projects(.*)?$: ADMIN|SUPERVISOR|OPERATOR
    #   ^\\/?api\\/v1\\/documents(.*)?$: ADMIN|SUPERVISOR|OPERATOR
    #   ^\\/?api\\/v1\\/ocr-results(.*)?$: ADMIN|SUPERVISOR|OPERATOR
    #   ^\\/?api\\/v1\\/jobs(.*)?$: ADMIN|SUPERVISOR|OPERATOR
    #   ^\\/?api\\/v1\\/files(.*)?$: ADMIN|SUPERVISOR|OPERATOR

    uris-by-roles:
      ^\/?db-check$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/admin(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/organisations(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      # /users/me avant /users : tout utilisateur appelle /users/me a la connexion.
      ^\/?api\/v1\/users\/me$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/users(.*)?$: T1_DV_GG_SMARTDOC-ADMINS
      ^\/?api\/v1\/annuaire(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/schemas(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/datasets(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/projects(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/documents(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/ocr-results(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/jobs(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/files(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS
      ^\/?api\/v1\/(test-recipes|test-executions|dataset-exports)(.*)?$: T1_DV_GG_SMARTDOC-ADMINS|T1_DV_GG_SMARTDOC-USERS