sonar.projectKey=nota-back
sonar.projectName=NOTA Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
# Les tests ne sont pas analyses : comme dans la configuration officielle.
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/.venv/**
sonar.coverage.exclusions=tests/**,scripts/**,src/**/migrations/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
