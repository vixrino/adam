[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Project
[project]
name = "nota"
version = "0.1.0"
description = "NOTA - anNotation et Tests Automatises"
authors = [
    {name = "Daniel FERREIRA LARA", email = "daniel.ferreiralara@banque-france.fr"},
    {name = "Lucas TEYSSIER", email = "lucas.teyssier@banque-france.fr"}
]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12"
keywords = ["tests automatises", "ocr", "labellisation", "annotation"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    # ORM + BDD
    "sqlalchemy[asyncio]==2.0.34",
    "alembic==1.18.4",
    "ldap3>=2.9.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    # API
    "fastapi==0.163.2",
    "starlette==1.7.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    # Config
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # Auth
    "python-jose[cryptography]==3.5.0",
    # PDF
    "pymupdf==2.1.0",
    # Interne BdF
    "exa-pie==1.4.0",
    "exa-logger==2.3.0",
    "httpx==0.28.1",
]

[dependency-groups] # [project.optional-dependencies]
dev = [
    # Tests
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-env==1.7.0",
    # Qualite
    "black==26.10.1",
    "isort==8.0.1",
    "pylint==4.0.9",
    "bandit==1.9.4",
    "interrogate==1.7.0",
    "mypy==2.1.0",
    # Outils
    "tzdata==2026.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adam_core", "src/adam_api", "src/adam_worker"]

# isort
[tool.isort]
profile = "black"
line_length = 100
py_version = 312
known_first_party = ["adam_api", "adam_core"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
combine_as_imports = true
split_on_trailing_comma = true

# black
[tool.black]
target-version = ["py312"]
line-length = 100
skip-string-normalization = false
preview = false

# Mypy
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations", "scripts"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

# PyMuPDF n'est pas type : ses appels sont dans ces seuls modules.
[[tool.mypy.overrides]]
module = ["adam_api.services.rapport_metriques_pdf", "adam_core.utils.pdf_render"]
disallow_untyped_calls = false

# Bandit (securite)
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
tests = ["B201", "B301"]
skips = ["B101", "B601", "B607"]

# Interrogate (docstrings)
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 95
exclude = ["setup.py", "docs", "build", "scripts"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
color = true
generate-badge = "."
badge-format = "svg"

# Pylint
[tool.pylint.master]
fail-under = 9.0
ignore-paths = [
    "src/adam_core/models",      
    "src/adam_core/migrations",   
]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "missing-docstring",
    "no-value-for-parameter",
    "no-member",
    "no-else-return",
    "fixme",
    "protected-access",
    "too-few-public-methods",
    "global-statement",
    "import-outside-toplevel",
    "broad-exception-caught",
    "duplicate-code",
]

[tool.pylint.design]
max-returns = 8

[tool.pylint.basic]
good-names = ["db", "id", "e", "f", "_engine", "_async_session_factory"]

# Coverage
[tool.coverage.run]
source = ["src"]
relative_files = true
omit = [
    "*/enums/*",
    "*/migrations/*",
    "*/models/*",
    "scripts/*",
    "src/adam_core/db/base.py",
    "src/adam_core/utils/volumetry.py",
    "src/adam_api/main.py",
    "src/adam_api/dependencies/db.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

# Pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short"
norecursedirs = ["env", "scripts", ".git", ".venv", "build", "dist"]
